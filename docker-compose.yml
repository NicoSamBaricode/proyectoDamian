version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/var/www/html
    environment:
      - MYSQL_HOST=db
    depends_on:
      - db

  db:
    image: mysql:5.6
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simulador
      MYSQL_USER: perseo
      MYSQL_PASSWORD: cio154618135
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
